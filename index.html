<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo de Frete</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="cabecalho">
             <h1>COTAÇÃO DE FRETE</h1>

        </div>
        <div class="centro">
        <p>Peso Bruto</p>
    <input type="number" id="pesobruto" oninput="calcular()"  placeholder="Peso Bruto">

     <p>ICMS</p>
    <input type="checkbox" id="meucheckbox" oninput="calcular()" >
    <select id="percentualIcms" onchange="calcular()">
        <option value="0.12">12%</option>
        <option value="0.18">18%</option>
        <option value="0.07">7%</option>
    </select>

    <p>Valor Frete</p>
    <input type="number" id="valorcobrado" oninput="calcular()" placeholder="Valor Frete">
  
    
    <p>Custo Real</p>

    <input id="custo"type="text" placeholder="Custo por KG">
<br>
</div>
    </div>

    <script src="index.js"></script>
    
</body>
</html>
